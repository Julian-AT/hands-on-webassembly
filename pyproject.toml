[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = ["assignments", "runtime", "wasm", "proof/harness", ".cache", "artifacts", "node_modules", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

# Standalone harnesses establish their import path before importing helpers.
ignore = ["E402"]
