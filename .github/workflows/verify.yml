name: Verify repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      COURSE_ASSET_TOKEN: ${{ secrets.COURSE_ASSET_TOKEN || github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Provision scratch storage for the retained reserve
        # This is an ephemeral hosted runner; scientific checks do not use Xcode.
        run: |
          sudo rm -rf /Applications/Xcode*.app
          python3 - <<'PYTHON'
          import shutil
          available = shutil.disk_usage(".").free
          assert available >= 24 * 1024**3, f"Need 24 GiB before setup; have {available} bytes"
          print(f"Provisioned {available / 1024**3:.1f} GiB; the 15 GiB reserve remains enforced")
          PYTHON
      - run: make setup
      - run: make check
      - run: make test
      - run: node scripts/toolchain.mjs commit-check
      - name: Verify two identical clean exports
        run: |
          make build
          cp web/out/release-manifest.json artifacts/export-first.json
          make build
          cmp artifacts/export-first.json web/out/release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-records
          path: |
            artifacts/proof/evidence/gate.json
            artifacts/proof/evidence/coverage-contract.json
            artifacts/export-first.json
            web/out/release-manifest.json
          if-no-files-found: warn
